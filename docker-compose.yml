services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: .
    container_name: erp-web
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=ERPSystemDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      SendGridSettings__ApiKey: ${SENDGRID_API_KEY}
      SendGridSettings__SenderEmail: ${SENDGRID_SENDER_EMAIL}
      SendGridSettings__SenderName: ERP System
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      Authentication__Facebook__AppId: ${FACEBOOK_APP_ID}
      Authentication__Facebook__AppSecret: ${FACEBOOK_APP_SECRET}

volumes:
  sqldata:
